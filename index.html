<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Catalog - QR Catalog</title>
    <style>
        :root {
            --primary-color: #1e293b;
            --accent-color: #3b82f6;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            min-height: 30vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .company-logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1.part-name {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }

        .part-number {
            font-size: 1.1rem;
            background: var(--border-color);
            padding: 0.3rem 1rem;
            border-radius: 50px;
            color: var(--text-muted);
            display: inline-block;
        }

        section {
            padding: 3rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        section h2 {
            font-size: 1.6rem;
            margin-bottom: 1.2rem;
            color: var(--accent-color);
            position: relative;
        }

        section h2::after {
            content: '';
            display: block;
            width: 40px;
            height: 3px;
            background-color: var(--accent-color);
            margin: 0.4rem auto 0;
            border-radius: 2px;
        }

        .media-container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 1rem;
        }

        .media-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .viewer-container {
            width: 100%;
            max-width: 800px;
            height: 450px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .viewer-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="company-logo">MECO TN</div>
        <h1 class="part-name">High-Pressure Hydraulic & Pumping System</h1>
        <div class="part-number">MECO-SYS-001</div>
        <p style="margin-top: 0.8rem; color: var(--text-muted);">Real installation photo & 3D model below ↓</p>
    </header>

    <!-- قسم الصور الحقيقية -->
    <section>
        <h2>Real System Photo</h2>
        <div class="media-container">
            <!-- ملاحظة: يمكنك لاحقاً رفع الصورة إلى مستودع غيت هاب وتغيير رابط الـ src هنا لتدخل الصورة مباشرة -->
            <img src="https://via.placeholder.com/600x800/1e293b/3b82f6?text=Upload+Real+Photo+Here" alt="Real System Installation">
        </div>
        <p style="color: var(--text-muted); font-size: 0.9rem;">The actual hardware setup at the site.</p>
    </section>

    <!-- قسم نموذج 3D -->
    <section>
        <h2>3D Engineering Model</h2>
        <div class="viewer-container">
            <iframe src="https://gmail6690048.autodesk360.com/g/shares/SH90d2dQT28d5b6028119dcd7af2681634f6" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>
        </div>
    </section>

</body>
</html>
