<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermeco Industrie - Interactive Catalog</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #131d31;
            --card-hover: #1e293b;
            --accent-color: #3b82f6;
            --neon-green: #22c55e;
            --facebook-color: #1877f2;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #2a3852;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            background: linear-gradient(180deg, #0f172a 0%, #090d16 100%);
            padding: 2.5rem 1rem 1.5rem 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-container {
            display: flex;
            flex-direction: row; /* تم التعديل هنا ليظهر الشعار بجانب النص */
            align-items: center;
            justify-content: center;
            gap: 1.5rem; /* مسافة بين الشعار والنص */
        }

        .logo-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .brand-text-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* محاذاة النص للبدء من اليسار */
            gap: 0.3rem;
        }

        .company-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        .tagline {
            color: var(--neon-green);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.3);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.25);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--neon-green);
            margin-top: 0.8rem;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-green);
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 12px var(--neon-green); }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .main-container {
            max-width: 550px;
            margin: auto;
            padding: 2rem 1.2rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .menu-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 1.2rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 1.2rem;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .menu-card:hover {
            border-color: var(--accent-color);
            background-color: var(--card-hover);
            transform: translateY(-3px);
        }

        .card-icon { font-size: 2.2rem; }
        .card-title { color: var(--text-color); font-weight: 700; }
        .card-desc { color: var(--text-muted); font-size: 0.8rem; }

        footer { text-align: center; padding: 1rem; color: var(--text-muted); font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <img src="logo.jpg" alt="Thermeco Logo" class="logo-img">
            <div class="brand-text-group">
                <div class="company-title">Thermeco</div>
                <div class="tagline">We are here to help you</div>
            </div>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>Live System - Online</span>
        </div>
    </header>

    <div class="main-container">
        <!-- أضف بقية محتوى الكود هنا -->
    </div>

    <footer>&copy; 2026 Thermeco Industrie - All Rights Reserved</footer>

</body>
</html>
